<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="tab1">Tab1</button>
    <button class="tab2">Tab2</button>

    <input type="text" placeholder="Write your text" id="textInput" name="" />
    <div class="name">Name</div>

    <div class="com">Comment</div>

    <script>
      const tab1 = document.querySelector(".tab1");
      const tab2 = document.querySelector(".tab2");
      const input = document.querySelector("#textInput");
      const nameBox = document.querySelector(".name");
      const comBox = document.querySelector(".com");

      console.log(tab1, tab2, input, nameBox, comBox);

      function showText(box, label) {
        const text = input.value.trim();

        if (text === "") {
          alert("Write text");
          return;
        }
        box.textContent = label + ":" + text;
        input.value = "";
      }

      tab1.addEventListener("click", function () {
        showText(nameBox, "Name");
      });
      tab2.addEventListener("click", function () {
        showText(comBox, "Comment");
      });
    </script>
  </body>
</html>
